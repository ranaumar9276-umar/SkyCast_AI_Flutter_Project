name: weather_app
description: "SkyCast AI - Professional Weather App with Gemini AI Integration"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.1.0

  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # State Management
  provider: ^6.1.1

  # UI & Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.1.0

  # AI Integration
  google_generative_ai: ^0.4.3

  # Local Storage
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.18.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
